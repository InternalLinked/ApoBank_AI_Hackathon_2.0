version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "580218335461"
    AWS_DEFAULT_REGION: "us-west-2"
    ECR_REPO: "apobank-hackathon"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - echo "Build commit $COMMIT_TAG"

  build:
    commands:
      - echo Building combined frontend+backend image...
      - docker build -t $REGISTRY/$ECR_REPO:$COMMIT_TAG -t $REGISTRY/$ECR_REPO:latest .

  post_build:
    commands:
      - echo Pushing image to ECR...
      - docker push $REGISTRY/$ECR_REPO:$COMMIT_TAG
      - docker push $REGISTRY/$ECR_REPO:latest
      - printf '[{"name":"apobank-frontend","imageUri":"%s:%s"}]' "$REGISTRY/$ECR_REPO" "$COMMIT_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
